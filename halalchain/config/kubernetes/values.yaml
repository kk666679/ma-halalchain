# Helm values for HalalChain Agent System
replicaCount: 1

image:
  repository: halalchain/agent-system
  tag: latest
  pullPolicy: IfNotPresent

# Each agent as a separate deployment (or sidecar)
agents:
  supervisor:
    replicas: 1
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "500m"
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 70

  payments:
    replicas: 2
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "2Gi"
        cpu: "1000m"
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 60
        - type: Pods
          pod:
            metric:
              name: custom.metrics.llm_queue_length
            target:
              type: AverageValue
              averageValue: "10"

  logistics:
    replicas: 2
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 6

  erp:
    replicas: 1
    resources:
      requests:
        memory: "1Gi"
        cpu: "400m"

  ecom-pos:
    replicas: 2
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"

  crm:
    replicas: 1
    resources:
      requests:
        memory: "512Mi"
        cpu: "300m"

  ai:
    replicas: 3
    resources:
      requests:
        memory: "2Gi"
        cpu: "1000m"
      limits:
        memory: "4Gi"
        cpu: "2000m"
    hpa:
      enabled: true
      minReplicas: 3
      maxReplicas: 10
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 50
        - type: Pods
          pod:
            metric:
              name: custom.metrics.llm_queue_length
            target:
              type: AverageValue
              averageValue: "5"

  blockchain:
    replicas: 1
    resources:
      requests:
        memory: "2Gi"
        cpu: "1000m"
      limits:
        memory: "4Gi"
        cpu: "2000m"
    # Only 1 replica due to stateful contract interactions

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: api.halalchain.com
      paths:
        - path: /
          pathType: Prefix

# Prometheus & Grafana monitoring
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
  grafanaDashboard:
    enabled: true

# Service Mesh (Istio)
istio:
  enabled: true
  gateway:
    name: halalchain-gateway
