apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "halalchain-agents.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "halalchain-agents.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ include "halalchain-agents.chart" . }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "halalchain-agents.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "halalchain-agents.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: halalchain
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port | default 8080 }}
          env:
            # Many deployments rely on these; keep minimal and allow overriding via Helm values later.
            - name: PORT
              value: "{{ .Values.service.port | default 8080 }}"

